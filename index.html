<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lakewood Police Department - Interactive Blotter</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        #map { height: 100%; width: 100%; z-index: 1; }
    </style>
</head>
<body class="bg-slate-50 h-screen flex flex-col overflow-hidden relative">

    <header class="bg-slate-900 text-white shadow-md flex-shrink-0 w-full z-10">
        <div class="w-full px-4 sm:px-6 lg:px-8 py-4">
            <div class="flex items-center space-x-4">
                <div class="bg-slate-800 p-2.5 rounded-full border border-slate-700">
                    <i class="fa-solid fa-shield-halved text-blue-400 text-xl"></i>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight">Lakewood Police Department</h1>
                    <p class="text-slate-400 text-xs font-medium uppercase tracking-wide">Interactive Public Blotter</p>
                </div>
            </div>
        </div>
    </header>

    <div class="flex-1 flex flex-col md:flex-row overflow-hidden relative">
        
        <div id="feed-side" class="w-full md:w-1/2 lg:w-5/12 flex flex-col bg-white border-r border-slate-200 overflow-hidden h-full">
            <div class="p-4 border-b border-slate-200 bg-slate-50 flex-shrink-0 grid grid-cols-3 gap-2">
                <input id="search-input" type="text" placeholder="Search incidents..." class="col-span-2 block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-blue-500 focus:border-blue-500 transition-colors">
                <select id="type-filter" class="col-span-1 block w-full px-2 py-2 border border-slate-300 rounded-lg text-sm bg-white focus:ring-blue-500 focus:border-blue-500 transition-colors text-slate-700">
                    <option value="all">All</option>
                    <option value="arrest">Arrests</option>
                    <option value="incident">Incidents</option>
                </select>
            </div>

            <div id="incident-feed" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24 md:pb-4">
                <div class="p-4 text-center text-slate-500 text-sm">Loading latest blotter data...</div>
            </div>
        </div>

        <div id="map-side" class="hidden md:block w-full md:w-1/2 lg:w-7/12 h-full relative bg-slate-200">
            <div id="map"></div>
        </div>

        <button id="mobile-view-toggle" class="md:hidden absolute bottom-6 right-6 bg-blue-600 hover:bg-blue-700 text-white px-5 py-3 rounded-full shadow-xl font-medium z-[1000] flex items-center space-x-2 border border-blue-700 transition-transform active:scale-95">
            <i id="toggle-icon" class="fa-solid fa-map"></i>
            <span id="toggle-text">Map View</span>
        </button>

    </div>

<script>
        // Initialize Leaflet Map
        const map = L.map('map').setView([41.4819, -81.7985], 14);
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        let markersMap = {};
        let globalBlotterData = [];
        let showingMapOnMobile = false;
        let geocodeTimeouts = []; // Tracks staggered pins so they can be cancelled if user searches

        // Mobile View Toggle Logic
        const toggleBtn = document.getElementById('mobile-view-toggle');
        const feedSide = document.getElementById('feed-side');
        const mapSide = document.getElementById('map-side');
        const toggleIcon = document.getElementById('toggle-icon');
        const toggleText = document.getElementById('toggle-text');

        toggleBtn.addEventListener('click', () => {
            showingMapOnMobile = !showingMapOnMobile;
            if (showingMapOnMobile) {
                feedSide.classList.add('hidden');
                mapSide.classList.remove('hidden');
                mapSide.classList.add('block');
                toggleIcon.classList.replace('fa-map', 'fa-list');
                toggleText.innerText = 'List View';
                setTimeout(() => map.invalidateSize(), 100); 
            } else {
                feedSide.classList.remove('hidden');
                mapSide.classList.add('hidden');
                mapSide.classList.remove('block');
                toggleIcon.classList.replace('fa-list', 'fa-map');
                toggleText.innerText = 'Map View';
            }
        });

        function formatDateTime(rawDateTimeStr) {
            if (!rawDateTimeStr) return "Time Unknown";
            const parts = rawDateTimeStr.split(' ');
            if (parts.length !== 2) return rawDateTimeStr;
            
            const dateStr = parts[0];
            const timeStr = parts[1];
            
            const dateObj = new Date(dateStr);
            const formattedDate = dateObj.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
            
            const timeParts = timeStr.split(':');
            let hours = parseInt(timeParts[0]);
            const minutes = timeParts[1];
            const ampm = hours >= 12 ? 'PM' : 'AM';
            hours = hours % 12;
            hours = hours ? hours : 12; 
            const formattedTime = `${hours}:${minutes} ${ampm}`;
            
            return `${formattedDate} • ${formattedTime}`;
        }

        async function loadData() {
            try {
                const response = await fetch(`data/blotter.json?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Data file not found");
                let data = await response.json();
                
                const uniqueCases = new Set();
                let cleanedData = data.filter(incident => {
                    const stringified = JSON.stringify(incident).toLowerCase();
                    if (stringified.includes("event type filter") || stringified.includes("page ")) return false;
                    
                    // FRONTEND DEDUPLICATION: Ensure no duplicate IDs render
                    if (uniqueCases.has(incident.case_number)) return false;
                    uniqueCases.add(incident.case_number);
                    
                    return true;
                });

                cleanedData.sort((a, b) => {
                    if (!a.raw_datetime) return 1;
                    if (!b.raw_datetime) return -1;
                    return new Date(b.raw_datetime) - new Date(a.raw_datetime);
                });

                if (cleanedData.length === 0) {
                    document.getElementById('incident-feed').innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">No current incidents to display.</div>';
                    return;
                }
                
                globalBlotterData = cleanedData;
                renderBlotter(globalBlotterData);
                setupFilters();

            } catch (error) {
                console.error(error);
                document.getElementById('incident-feed').innerHTML = 
                    '<div class="p-4 text-red-600 text-center text-sm">Failed to load current blotter data.</div>';
            }
        }

        function setupFilters() {
            const searchInput = document.getElementById('search-input');
            const typeFilter = document.getElementById('type-filter');
            
            function applyFilters() {
                const searchTerm = searchInput.value.toLowerCase();
                const selectedType = typeFilter.value;
                
                const filteredData = globalBlotterData.filter(incident => {
                    const matchesSearch = incident.charge.toLowerCase().includes(searchTerm) || 
                                          incident.raw_address.toLowerCase().includes(searchTerm) ||
                                          incident.officer.toLowerCase().includes(searchTerm) ||
                                          incident.case_number.toLowerCase().includes(searchTerm);
                                          
                    let matchesType = true;
                    if (selectedType === 'arrest') matchesType = incident.type === 'Arrest';
                    else if (selectedType === 'incident') matchesType = incident.type === 'Incident';
                    
                    return matchesSearch && matchesType;
                });
                
                renderBlotter(filteredData);
            }

            searchInput.addEventListener('input', applyFilters);
            typeFilter.addEventListener('change', applyFilters);
        }

        function renderBlotter(blotterData) {
            const feedContainer = document.getElementById('incident-feed');
            feedContainer.innerHTML = '';
            
            // Cancel any pending staggered map pin delays from previous renders
            geocodeTimeouts.forEach(clearTimeout);
            geocodeTimeouts = [];
            
            // Completely clear existing map markers to prevent stacking
            for (let id in markersMap) {
                map.removeLayer(markersMap[id].marker);
            }
            markersMap = {}; // Reset the storage object

            if (blotterData.length === 0) {
                feedContainer.innerHTML = '<div class="p-4 text-center text-slate-500 text-sm">No matching incidents found.</div>';
                return;
            }

            blotterData.forEach((incident, index) => {
                const isRed = incident.badge_color === 'red';
                const themeClass = isRed ? 'bg-red-100 text-red-800 border-red-200' : 'bg-blue-100 text-blue-800 border-blue-200';
                const headerClass = isRed ? 'bg-red-50 border-red-100' : 'bg-blue-50 border-blue-100';
                const icon = isRed ? 'fa-handcuffs' : 'fa-file-lines';
                const displayTime = formatDateTime(incident.raw_datetime);

                const cardHTML = `
                    <div id="card-${incident.id}" class="bg-white rounded-xl shadow-sm border border-slate-200 hover:border-blue-400 transition-all overflow-hidden flex flex-col">
                        <div class="${headerClass} border-b px-4 py-3 flex justify-between items-center">
                            <span class="${themeClass} text-sm font-bold px-2.5 py-1 rounded border uppercase tracking-wide">
                                <i class="fa-solid ${icon} mr-1"></i> ${incident.type}
                            </span>
                            <span class="text-xs font-medium text-slate-600">
                                <i class="fa-regular fa-clock mr-1"></i> ${displayTime}
                            </span>
                        </div>
                        <div class="p-4">
                            <h3 class="text-lg font-bold text-slate-900 mb-1">${incident.charge}</h3>
                            <button onclick="focusIncident(${incident.id})" class="group flex items-start mt-2 mb-3 space-x-2 text-left text-blue-600 hover:text-blue-800 transition-colors text-sm font-medium focus:outline-none">
                                <i class="fa-solid fa-location-dot mt-1 text-blue-500 group-hover:bounce"></i>
                                <span class="underline decoration-dotted group-hover:decoration-solid">${incident.raw_address}</span>
                            </button>
                            
                            <div class="bg-slate-50 rounded-lg p-3 text-sm text-slate-700 border border-slate-100 mb-4">
                                ${incident.details}
                            </div>
                            
                            <div class="flex justify-between items-end text-xs">
                                <div>
                                    <p class="text-slate-500 uppercase font-semibold mb-0.5">Officer</p>
                                    <p class="font-medium text-slate-800 text-sm">${incident.officer}</p>
                                </div>
                                <div class="text-right">
                                    <p class="text-slate-500 uppercase font-semibold mb-0.5">Case ID</p>
                                    <p class="font-mono text-slate-800 font-medium text-sm">${incident.case_number}</p>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                feedContainer.insertAdjacentHTML('beforeend', cardHTML);
                
                // Keep the stagger, but save the timeout ID so we can cancel it if needed
                const timeoutId = setTimeout(() => geocodeAndPlot(incident), index * 1100);
                geocodeTimeouts.push(timeoutId);
            });
        }

        async function geocodeAndPlot(incident) {
            if (!incident.clean_address) return;
            try {
                const url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(incident.clean_address)}&limit=1`;
                const response = await fetch(url);
                if (response.status === 429) {
                    console.warn("Nominatim Rate Limit hit. Pin skipped.");
                    return;
                }
                const data = await response.json();

                if (data && data.length > 0) {
                    const lat = parseFloat(data[0].lat);
                    const lon = parseFloat(data[0].lon);
                    const marker = L.marker([lat, lon]).addTo(map);
                    marker.bindPopup(`<strong>${incident.charge}</strong><br><span style="font-size:13px;">${incident.raw_address}</span><br><span style="font-size:13px; font-weight:600; color:#2563eb;">ID: ${incident.case_number}</span>`);
                    markersMap[incident.id] = { marker, coords: [lat, lon] };
                }
            } catch (error) {
                console.error(`Failed to plot address:`, error);
            }
        }

        function focusIncident(id) {
            const target = markersMap[id];
            
            if (window.innerWidth < 768 && !showingMapOnMobile) {
                toggleBtn.click();
            }

            if (target) {
                setTimeout(() => {
                    map.setView(target.coords, 17, { animate: true, duration: 1 });
                    target.marker.openPopup();
                }, 200);

                document.querySelectorAll('#incident-feed > div').forEach(card => card.classList.remove('ring-2', 'ring-blue-500', 'border-transparent'));
                const activeCard = document.getElementById(`card-${id}`);
                if (activeCard) {
                    activeCard.classList.add('ring-2', 'ring-blue-500', 'border-transparent');
                    if (window.innerWidth >= 768) {
                        activeCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            } else {
                alert("Location coordinates still rendering or restricted for this incident.");
            }
        }

        document.addEventListener('DOMContentLoaded', loadData);
    </script>
</body>
</html>
